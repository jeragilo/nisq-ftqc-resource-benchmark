name: experiment-0-ci

on:
  pull_request:
  push:
    branches:
      - main
      - experiment-0-raw-zne

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  experiment-0:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run Experiment 0
        run: python -m pipelines.exp00_raw_vs_zne
      - name: Upload raw Experiment 0 data
        uses: actions/upload-artifact@v4
        with:
          name: experiment-0-raw
          path: results/raw/experiment_0.csv
          if-no-files-found: error
