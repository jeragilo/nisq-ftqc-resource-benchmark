name: research-ci

on:
  pull_request:
  push:
    branches:
      - main
      - experiment-1-qem-sweep

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  experiment-1-smoke:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run small Experiment 1 smoke sweep
        run: python -m pipelines.exp01_qem_sweep --quick --output results/raw/experiment_1_smoke.csv
      - name: Upload smoke data
        uses: actions/upload-artifact@v4
        with:
          name: experiment-1-smoke
          path: results/raw/experiment_1_smoke.csv
          if-no-files-found: error

  experiment-1-full:
    if: github.event_name == 'push' && github.ref == 'refs/heads/experiment-1-qem-sweep'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full Experiment 1
        run: python -m pipelines.exp01_qem_sweep
      - name: Upload raw Experiment 1 data
        uses: actions/upload-artifact@v4
        with:
          name: experiment-1-raw
          path: results/raw/experiment_1.csv
          if-no-files-found: error
